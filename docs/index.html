*{box-sizing:border-box} :root{--bg:#111319;--side:#171a21;--panel:#1d212b;--line:#2d3442;--ink:#edf1fa;--muted:#929bad;--accent:#a8c4ff;--soft:#26364f;--green:#81d7b8;--red:#ff9d9d} body.light{--bg:#f6f7fa;--side:#edf0f5;--panel:#fff;--line:#d6dce6;--ink:#192234;--muted:#59677b;--accent:#315ca7;--soft:#e2eaff;--green:#24785e;--red:#a53939}body{margin:0;font:14px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit;color:inherit}button,select{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}button:hover,button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);color:var(--bg);border-color:transparent;font-weight:650}body.light button.primary{color:white}button.ghost{background:none;border-color:transparent}button.danger{color:var(--red);border-color:var(--red)}.shell{display:grid;grid-template-columns:252px minmax(0,1fr);height:100dvh;overflow:hidden}.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:20px 14px;gap:12px}.brand{display:flex;gap:11px;align-items:center;padding:6px 8px 17px}.mark{width:34px;height:34px;border:1px solid var(--accent);border-radius:12px;display:grid;place-items:center;color:var(--accent);font-size:20px}.brand strong{letter-spacing:2px;font-size:16px}.brand small,.muted,small{color:var(--muted)}.nav{overflow:auto;flex:1}.label{color:var(--muted);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;padding:18px 10px 7px}.nav button{display:flex;gap:10px;width:100%;text-align:left;background:none;border:0;margin:2px 0;color:var(--muted);padding:10px}.nav button.active{color:var(--ink);background:var(--soft);font-weight:600}.nav button:hover{color:var(--ink)}.bottom{border-top:1px solid var(--line);padding:12px 8px 0}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px}.main{min-width:0;display:flex;flex-direction:column;min-height:0}.top{border-bottom:1px solid var(--line);min-height:66px;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.topgroup,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:20px;color:var(--muted)}.demo{color:var(--accent)}.title{font-weight:650;font-size:16px}.content{flex:1;overflow:auto;min-height:0}.wrap{width:min(810px,100%);padding:32px 26px;margin:auto}.chatwrap{padding-bottom:16px}.intro{margin:3vh 0 26px}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--accent);text-transform:uppercase}.intro h1{font-size:clamp(29px,4vw,44px);letter-spacing:-1.7px;line-height:1.14;margin:9px 0}.intro p{color:var(--muted);max-width:560px}.prompts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}.prompts button{text-align:left;padding:15px;min-height:75px}.prompts small{display:block;margin-top:4px}.bubble{margin:18px 0;display:flex;gap:12px}.avatar{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--accent);flex:none}.message{min-width:0;flex:1}.message p{margin:5px 0 12px}.user{justify-content:flex-end}.user .message{flex:0 1 auto;background:var(--panel);border:1px solid var(--line);border-radius:15px 15px 3px 15px;padding:10px 15px;white-space:pre-wrap;overflow-wrap:anywhere}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px;margin:12px 0}.card h3{margin:0 0 4px;font-size:16px}.card p{color:var(--muted);margin:5px 0 12px}.chart{margin:14px 0;display:grid;gap:10px}.bar{display:grid;grid-template-columns:120px 1fr 55px;gap:10px;align-items:center;font-size:12px}.track{height:8px;border-radius:10px;background:var(--line)}.track i{display:block;height:100%;border-radius:10px;background:var(--accent)}.composer-area{padding:0 24px 14px;background:var(--bg)}.composer{max-width:758px;margin:auto;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;box-shadow:0 6px 26px #0002}.composer textarea{display:block;width:100%;background:none;border:none;resize:vertical;min-height:58px;max-height:180px;outline:none;padding:6px}.composer .row{justify-content:space-between}.hint{text-align:center;font-size:11px;color:var(--muted);margin:7px 0 0}.pagehead h1{font-size:30px;letter-spacing:-.8px;margin:4px 0}.pagehead p{color:var(--muted);margin:0 0 22px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid .card{margin:0}.spread{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.state{color:var(--green);font-size:12px}.field{display:grid;gap:5px;margin:12px 0}.field input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px}.divider{height:1px;background:var(--line);margin:14px 0}.notice{border-left:3px solid var(--accent);padding:8px 12px;color:var(--muted);margin:15px 0}.toast{position:fixed;bottom:20px;right:20px;z-index:9;background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:13px 18px;max-width:min(350px,90vw);box-shadow:0 8px 30px #0005}.hidden{display:none!important}.menu{display:none}dialog{color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(440px,90vw)}dialog::backdrop{background:#0009}.switch{display:inline-flex;align-items:center;gap:7px}.switch input{accent-color:var(--accent)}a{color:var(--accent)}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{display:none;position:fixed;inset:0 auto 0 0;width:252px;z-index:5;box-shadow:0 0 0 100vmax #0008}.side.open{display:flex}.menu{display:inline-block}.top{padding:10px 12px}.top .tag{display:none}.wrap{padding:20px 15px}.composer-area{padding:0 10px 10px}.grid,.prompts{grid-template-columns:1fr}.intro{margin:1vh 0 18px}.bar{grid-template-columns:90px 1fr 45px}.brand{padding-top:10px}} @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}</style></head>
<body><div class="shell"><aside class="side" id="side"><div class="brand"><div class="mark">✳</div><div><strong>JARVIS</strong><br><small>TIHULU · Personal AI</small></div></div><button class="primary" id="new">＋ New conversation</button><nav class="nav" aria-label="Workspaces"><div class="label">Workspace</div><button data-page="chat" class="active">◈ &nbsp; Chat</button><button data-page="agents">◎ &nbsp; Agents & tasks</button><button data-page="library">▤ &nbsp; Library</button><div class="label">Conversations</div><button data-sample="research">↳ &nbsp; Local model research</button><button data-sample="voice">↳ &nbsp; Voice assistant setup</button><button data-sample="files">↳ &nbsp; Organize project files</button><div class="label">Manage</div><button data-page="market">◫ &nbsp; AI Market</button><button data-page="models">▣ &nbsp; My models</button><button data-page="profiles">◉ &nbsp; Profiles & permissions</button><button data-page="connections">⇄ &nbsp; Connections</button><button data-page="settings">⚙ &nbsp; Settings</button></nav><div class="bottom"><span class="dot"></span> <span>Local-first · demo</span><br><small>No connected runtime</small></div></aside>
<main class="main"><header class="top"><div class="topgroup"><button class="menu" id="menu" aria-label="Toggle navigation">☰</button><span class="title" id="heading">Chat</span><span class="tag demo">UI PREVIEW</span></div><div class="topgroup"><select id="mode" aria-label="Execution profile"><option value="LOCAL_ONLY">Local only</option><option value="CLOUD_CHAT">Cloud chat</option><option value="SECURE_HYBRID">Secure hybrid</option><option value="CUSTOM">Custom</option></select><button class="danger" id="hard">■ Hard stop</button></div></header>
<section class="content" id="content"><div class="wrap chatwrap" id="view"></div></section><div class="composer-area" id="composerArea"><div class="composer"><textarea id="prompt" rows="2" aria-label="Message Jarvis" placeholder="Ask Jarvis anything…"></textarea><div class="row"><div class="row"><button class="ghost" id="attach" aria-label="Preview attachment">＋</button><select id="model" aria-label="Chat model"><option>Auto · local</option><option>Qwen Coder · Jan</option><option>Jan 4B</option><option>Cloud planner · demo</option></select></div><div class="row"><button id="mic" aria-label="Preview microphone">🎙 Talk</button><button class="primary" id="send" aria-label="Send demo message">↑ Send</button></div></div></div><p class="hint">Design prototype · no inference, microphone access, network requests or computer actions</p></div></main></div>
<dialog id="modal"><h2 id="modalTitle"></h2><p id="modalBody"></p><div class="row" style="justify-content:flex-end"><button id="closeModal">Close</button><button class="primary" id="modalAction">Confirm preview</button></div></dialog><div class="toast hidden" id="toast" role="status"></div>
<script>
'use strict'; const $=id=>document.getElementById(id);let page='chat', sample='',messages=[],recording=false,toastTimer,modalCallback=null;const state={profile:'LOCAL_ONLY',theme:'dark',lang:'en',permissions:{Shell:'ASK',Files:'ASK',Browser:'DENY',Network:'DENY',GitHub:'ASK'},installed:new Set(['Qwen Coder','Jan 4B']),agents:[],custom:[]};
const labels={chat:'Chat',agents:'Agents & tasks',library:'Library',market:'AI Market',models:'My models',profiles:'Profiles & permissions',connections:'Connections',settings:'Settings'};const prompts=[['research','Compare local AI models','Model guidance · chart & table'],['files','Organize my project files','Review a permission request'],['voice','Set up voice conversation','Whisper, language and Piper'],['task','Plan a multi-step task','Local agents & cloud planning']];
const head=(a,b)=>'<div class="pagehead"><div class="eyebrow">JARVIS WORKSPACE</div><h1>'+a+'</h1><p>'+b+'</p></div>';
const card=(a,b,c='')=>'<div class="card"><h3>'+a+'</h3><p>'+b+'</p>'+c+'</div>';const btn=(text,action,cls='')=>'<button class="'+cls+'" data-action="'+action+'">'+text+'</button>';
function notify(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
function dialog(title,body,cb=null){$('modalTitle').textContent=title;$('modalBody').textContent=body;modalCallback=cb;$('modalAction').classList.toggle('hidden',!cb);$('modal').showModal()}
$('closeModal').onclick=()=>$('modal').close();$('modalAction').onclick=()=>{const cb=modalCallback;$('modal').close();if(cb)cb()};
function navigate(p){page=p;$('heading').textContent=labels[p];$('composerArea').classList.toggle('hidden',p!=='chat');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('side').classList.remove('open');render();$('content').scrollTop=0}
function example(k){sample=k;messages=[];navigate('chat')}
function sampleBody(){if(sample==='research')return '<p>Here is a sample comparison for a 16 GB VRAM computer. These figures are illustrative, not measured benchmarks.</p>'+card('Local model comparison','Illustrative VRAM allocation · 16 GB example','<div class="chart"><div class="bar"><span>Jan 4B</span><div class="track"><i style="width:25%"></i></div><span>4 GB</span></div><div class="bar"><span>Qwen Coder</span><div class="track"><i style="width:80%"></i></div><span>13 GB</span></div><div class="bar"><span>GPT-OSS 20B</span><div class="track"><i style="width:65%"></i></div><span>10 GB</span></div></div><div class="divider"></div><small>Best fit depends on quantization, context length and runtime.</small><div class="row" style="margin-top:12px">'+btn('Explore AI Market','go-market')+btn('Preview report','report')+'</div>');if(sample==='files')return '<p>I can propose a read-only scan first. Nothing will be sent to a cloud model or changed without explicit permission.</p>'+card('Permission request','Demo · local agent wants to list a selected project folder.','<div class="spread"><span class="tag">READ ONLY · selected folder</span><span class="tag">Local Jan</span></div><div class="row" style="margin-top:14px">'+btn('Allow once','allow','primary')+btn('Deny','deny')+'</div>');if(sample==='voice')return '<p>We can keep speech recognition, inference and speech synthesis independently configurable.</p>'+card('Voice pipeline','Example configuration · not detected on your computer','<div class="row"><span class="tag">STT · Whisper</span><span class="tag">LLM · Jan</span><span class="tag">TTS · Piper</span></div><div class="row" style="margin-top:14px">'+btn('Voice settings','go-settings')+'</div>');return '<p>I would break the request into independent subtasks, with a local execution boundary and a review step.</p>'+card('Task plan','Demo · no task is running','<p>1. Understand scope<br>2. Create a plan<br>3. Request approval for local tools<br>4. Validate results</p>'+btn('Open agents','go-agents','primary'))}
function renderChat(){let h='';if(!sample&&!messages.length)h='<div class="intro"><div class="eyebrow">YOUR PERSONAL AI WORKSPACE</div><h1>What can I help you<br>with today?</h1><p>Ask, speak, research or work with your computer. You stay in control of what runs locally and what may go online.</p></div><div class="prompts">'+prompts.map(([k,a,b])=>'<button data-sample="'+k+'"><strong>'+a+'</strong><small>'+b+'</small></button>').join('')+'</div><div class="notice">Getting started: '+btn('Connect a local model','go-connections')+' <small>Optional · UI demonstration</small></div>';if(sample){let p=prompts.find(x=>x[0]===sample);h+='<div class="bubble user"><div class="message">'+p[1]+'</div></div><div class="bubble"><div class="avatar">✳</div><div class="message"><strong>Jarvis</strong> <small>· simulated response</small>'+sampleBody()+'</div></div>'} $('view').innerHTML=h;for(const m of messages){const b=document.createElement('div');b.className='bubble '+(m.role==='user'?'user':'');if(m.role!=='user'){const av=document.createElement('div');av.className='avatar';av.textContent='✳';b.append(av)}const text=document.createElement('div');text.className='message';text.textContent=m.text;b.append(text);$('view').append(b)}}
const models=[['Qwen Coder','LLM · coding & local tools','Local Jan'],['Jan 4B','LLM · lightweight chat','Local Jan'],['GPT-OSS 20B','LLM · reasoning','Local runtime'],['Whisper large-v3-turbo','STT · multilingual speech','Local'],['Piper','TTS · EN / TR / DE','Local'],['Cloud planner','LLM · optional planning','Remote · consent required']];
function render(){if(page==='chat'){renderChat();return}let h='';if(page==='market'||page==='models'){h=head(page==='market'?'AI Market':'My models',page==='market'?'Explore example language, speech and voice models. No downloads occur.':'Manage simulated model availability.');h+='<div class="field"><label for="search">Search models</label><input id="search" placeholder="Search LLM, STT, TTS…"></div><div class="grid" id="modelGrid">'+models.filter(m=>page==='market'||state.installed.has(m[0])).map(([a,b,c])=>'<div class="card modelcard"><div class="spread"><h3>'+a+'</h3><span class="tag">'+c+'</span></div><p>'+b+'</p>'+btn(state.installed.has(a)?'Preview details':'Preview add','model-'+models.findIndex(m=>m[0]===a))+'</div>').join('')+'</div>'}
if(page==='profiles'){h=head('Profiles & permissions','Choose how Jarvis may plan, communicate and act. All settings are mock.');h+=card('Execution profile',state.profile,'<div class="row">'+['LOCAL_ONLY','CLOUD_CHAT','SECURE_HYBRID','CUSTOM'].map(x=>btn(x,'mode-'+x,state.profile===x?'primary':'')).join('')+'</div>');h+=card('Tool permissions','Cloud models never execute shell. Local actions require policy approval.',Object.entries(state.permissions).map(([k,v])=>'<div class="spread" style="margin:10px 0"><span>'+k+'</span><select aria-label="'+k+' permission" data-permission="'+k+'">'+['DENY','ASK','SCOPED_ALLOW'].map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select></div>').join(''));h+=card('Custom profiles','Save a named configuration in this session only.','<div class="field"><input id="profileName" placeholder="Profile name" aria-label="Profile name"></div>'+btn('Save demo profile','save-profile')+'<div id="customList"></div>')}
if(page==='connections'){h=head('Connections','Set up local models and optional external providers without exposing your files.');h+='<div class="grid">'+card('Jan','Local LLM · no connection tested',btn('Set up Jan','jan','primary'))+card('Ollama','Local runtime · not connected',btn('Preview setup','connection'))+card('OpenCode','Local coding agent · not connected',btn('Preview setup','connection'))+card('Cloud providers','OpenAI / Claude / Gemini / NVIDIA · optional',btn('Preview credentials','connection'))+card('GPU host','Remote compute · no detected devices',btn('Preview host','connection'))+card('Boru Yolu','Optional integration · disconnected',btn('Preview setup','connection'))+'</div>'}
if(page==='agents'){h=head('Agents & tasks','One place for active plans, local execution and review.');h+=card('Demo task queue','No actual agents are running.',btn('Preview task plan','task','primary')+'<div class="divider"></div><div class="spread"><span>Local tool agent</span><span class="tag">Idle · demo</span></div><div class="spread"><span>Cloud planner</span><span class="tag">Not connected</span></div><div class="spread"><span>Review agent</span><span class="tag">Idle · demo</span></div>');h+=card('Orchestration','Auto · performance · economy', '<label class="field">Strategy<select><option>Auto</option><option>Performance</option><option>Economy</option></select></label><label class="field">Maximum parallel agents<select><option>3</option><option>1</option><option>6</option><option>10</option></select></label>')}
if(page==='library'){h=head('Library','Example artifacts generated inside conversations.');h+=card('Local model comparison','Report · sample',btn('Open in chat','research')+btn('Preview document','report'))+card('Voice setup notes','Conversation · sample',btn('Open in chat','voice'))+card('Project research','Files · sample',btn('Open in chat','files'))}
if(page==='settings'){h=head('Settings','Personalize the preview. No system settings are changed.');h+=card('Appearance','Choose the theme.','<div class="row">'+btn('Dark','dark',state.theme==='dark'?'primary':'')+btn('Light','light',state.theme==='light'?'primary':'')+'</div>');h+=card('Voice & language','Independent speech stages · demonstration','<label class="field">Speech language<select><option>Auto (TR / EN / DE)</option><option>English</option><option>Türkçe</option><option>Deutsch</option></select></label><label class="field">STT<select><option>Whisper large-v3-turbo</option><option>Whisper base</option></select></label><label class="field">TTS<select><option>Piper · English</option><option>Piper · Türkçe</option><option>Piper · Deutsch</option></select></label><label class="switch"><input type="checkbox"> Auto speak replies</label>');h+=card('Runtime & lifecycle','On-demand by default. Borrowed services are never stopped by GUI quit.','<label class="switch"><input type="checkbox"> Background mode (mock)</label><div class="row" style="margin-top:14px">'+btn('Quit UI preview','quit')+btn('Stop owned services','owned')+'</div>')}
$('view').innerHTML=h;if($('search'))$('search').oninput=e=>document.querySelectorAll('.modelcard').forEach(c=>c.classList.toggle('hidden',!c.textContent.toLowerCase().includes(e.target.value.toLowerCase())));if($('customList'))for(const name of state.custom){const p=document.createElement('p');p.textContent=name+' · saved in preview';$('customList').append(p)}}
function mode(m){state.profile=m;$('mode').value=m;notify('Preview profile: '+m);if(page==='profiles')render()}
function send(){const t=$('prompt').value.trim();if(!t)return;messages.push({role:'user',text:t},{role:'assistant',text:'This is a simulated response. Jarvis would use your selected profile, model and permissions to handle this request. No actual model or computer action was invoked.'});$('prompt').value='';renderChat();$('content').scrollTop=$('content').scrollHeight}
$('send').onclick=send;$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};$('new').onclick=()=>{sample='';messages=[];navigate('chat')};$('menu').onclick=()=>$('side').classList.toggle('open');$('mode').onchange=e=>mode(e.target.value);$('attach').onclick=()=>dialog('Attachments','The finished UI will accept authorized files. This preview does not read any files.');$('mic').onclick=()=>{recording=!recording;$('mic').textContent=recording?'■ Stop (demo)':'🎙 Talk';notify(recording?'Simulated listening · no microphone access':'Simulated recording stopped')};$('hard').onclick=()=>dialog('Hard stop','In the real app this would stop owned work. No process is running in this preview.',()=>{recording=false;$('mic').textContent='🎙 Talk';notify('Demo work stopped; no real processes affected')});
document.addEventListener('change',e=>{if(e.target.dataset.permission){state.permissions[e.target.dataset.permission]=e.target.value;notify('Mock permission updated')}});document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page)navigate(b.dataset.page);if(b.dataset.sample)example(b.dataset.sample);const a=b.dataset.action;if(!a)return;if(a.startsWith('go-'))navigate(a.slice(3));else if(a.startsWith('mode-'))mode(a.slice(5));else if(a.startsWith('model-')){let m=models[Number(a.slice(6))];dialog(m[0],m[1]+' · This is a sample catalog entry. No download or runtime connection.',state.installed.has(m[0])?null:()=>{state.installed.add(m[0]);notify('Added to mock models');render()})}else if(['research','voice','files','task'].includes(a))example(a);else if(a==='dark'||a==='light'){state.theme=a;document.body.classList.toggle('light',a==='light');render()}else if(a==='save-profile'){const v=$('profileName').value.trim();if(v){state.custom.push(v);render();notify('Demo profile saved')}}else if(a==='allow'||a==='deny'){b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);notify(a==='allow'?'Demo permission allowed once · no file access':'Demo permission denied')}else if(a==='jan')dialog('Set up Jan','Step 1: open Jan. Step 2: enable its local API. Step 3: discover and choose a model. This is a design preview only.',()=>notify('Demo wizard complete · no network connection'));else if(a==='connection')dialog('Connection setup','The real application would validate a local endpoint or request provider authorization. No credentials or connections are used.');else if(a==='report')dialog('Artifact preview','Local model comparison · example report. Values are illustrative; this is not a benchmark.');else if(a==='quit'||a==='owned')dialog('Lifecycle preview','No services are running. In the real application, UI quit and stopping owned services are separate actions.',()=>notify('Simulated action complete'))});navigate('chat');
</script></body></html>
