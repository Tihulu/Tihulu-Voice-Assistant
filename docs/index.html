const presets=[
{id:'local',name:'Local Only',mode:'LOCAL_ONLY',desc:'Local inference and authorized local tools. Strict offline by default.',planner:'Local',executor:'Local',disclosure:'None',llm:'Qwen3-Coder 30B',stt:'Whisper large-v3-turbo',tts:'Piper',route:'Economy',agents:2,web:'Offline'},
{id:'cloud',name:'Cloud Chat',mode:'CLOUD_CHAT',desc:'Cloud conversation only. No host tools, local files or shell.',planner:'Cloud',executor:'None',disclosure:'Explicit chat only',llm:'Cloud provider · example',stt:'Whisper large-v3-turbo',tts:'Piper',route:'Auto',agents:1,web:'Off'},
{id:'standard',name:'Standard Hybrid',mode:'STANDARD_HYBRID',desc:'Local and cloud planning; cloud proposals require scoped approval before local execution.',planner:'Local + cloud',executor:'Local',disclosure:'Explicit scoped approval',llm:'Auto route',stt:'Whisper large-v3-turbo',tts:'Piper',route:'Auto',agents:4,web:'Domain-scoped'},
{id:'secure',name:'Secure Hybrid',mode:'SECURE_HYBRID',desc:'Local planner and executor; only minimized, reviewed information may reach cloud advice.',planner:'Local',executor:'Local',disclosure:'Minimum necessary, reviewed',llm:'Auto route',stt:'Whisper large-v3-turbo',tts:'Piper',route:'Auto',agents:6,web:'Domain-scoped'}];

const providers=[
['jan','Jan','Local inference','Local loopback','http://127.0.0.1:1337','R1','Discover local models; verify no upstream forwarding.'],
['native','Native GGUF','Local inference','Selected model file','Example model directory','R3','Independent local backend, context and GPU configuration.'],
['ollama','Ollama','Local inference','Local loopback','http://127.0.0.1:11434','R3','Discover models and capability evidence.'],
['opencode','OpenCode','Agent connector','Local CLI / IPC','Example local session','R4','Start, continue, cancel, inspect session ownership.'],
['openai','OpenAI','Cloud provider','Official authorization','Example provider account','R3','API key or official authorization where supported.'],
['claude','Claude','Cloud provider','Official authorization','Example provider account','R3','Provider access and model discovery are separately checked.'],
['gemini','Gemini','Cloud provider','Official authorization','Example provider account','R3','Scoped authorization and explicit disclosure.'],
['nvidia','NVIDIA','Cloud provider','API key','Example provider account','R3','Rate limits and timeout recovery.'],
['glm','GLM','Cloud provider','Official authorization','Example provider account','R3','Optional backend; compatibility must be verified.'],
['deepseek','DeepSeek','Cloud provider','API key','Example provider account','R3','Cloud advice only in secure hybrid.'],
['gpu','Remote GPU host','Compute host','Authenticated lease','Example LAN host','R3','Capacity, ownership, lease and cancellation.'],
['firefox','Firefox research','Browser engine','Dedicated isolated profile','research.example.invalid','R2','Never reuse personal cookies or browser session.'],
['desktop','Desktop / COSMIC','Application engine','Portal / IPC','Example Wayland session','R4','Capability and scope checks; no generic control claims.'],
['git','Git / GitHub','Application engine','Local Git + scoped provider','Example repository','R4','Preview changes, no unapproved push or merge.'],
['boru','Boru Yolu','Optional integration','Contract discovery','Example local adapter','R4','Optional; compatibility not established.']];
const models=[
['Qwen3-Coder 30B','LLM','Jan','Local','Coding / tools','13 GB example','Detected mock'],
['Jan 4B','LLM','Jan','Local','Fast chat','3 GB example','Detected mock'],
['GPT-OSS 20B','LLM','GGUF','Local','Reasoning','12 GB example','Catalog mock'],
['Qwen3.6 35B','LLM','GGUF','Local','Reasoning / coding','16 GB example','Catalog mock'],
['Nemotron','LLM','NVIDIA','Cloud','Planning','Remote','Catalog mock'],
['DeepSeek','LLM','Cloud','Cloud','Planning','Remote','Catalog mock'],
['Whisper large-v3-turbo','STT','whisper.cpp','Local','TR / EN / DE','Example 1.6 GB','Detected mock'],
['Whisper base','STT','whisper.cpp','Local','Multilingual','Example 150 MB','Catalog mock'],
['Piper EN','TTS','Piper','Local','English','Example 60 MB','Detected mock'],
['Piper TR','TTS','Piper','Local','Türkçe','Example 60 MB','Detected mock'],

['csv','Analyze a CSV by voice','R1','Data & artifacts','Analyze temperature.csv, create a chart and speak the summary.','Local calculation → chart → table → follow-ups → export.'],
['memory','Multilingual conversation','R1','Voice & chat','Remember the word mavi.','Four turns, TR / EN / DE switching and remembered context.'],
['file','Research local documents','R1','Data & artifacts','Find references to antenna in the selected folder.','Scoped folder picker, literal search and result preview.'],
['expiry','Expired file permission','R1','Safety & recovery','Analyze the previously attached file.','Refusal, draft retained, re-select and authorize again.'],
['denied','Deny local shell','R1','Safety & recovery','List files in my selected project.','Permission prompt, deny and safe alternative.'],
['voice','Voice model missing','R1','Voice & chat','I want to talk to Jarvis.','Text mode remains usable; optional local model setup.'],
['setup','First launch / no Jan','R1','Voice & chat','Connect my local model.','Connection wizard, discovery, text-only ready state.'],
['search','Public research with citations','R2','Research','Research offline AI assistants.','Isolated research profile, approved domain, citations.'],
['injection','Untrusted web content','R2','Safety & recovery','Summarize this webpage.','Ignore instructions embedded in retrieved content.'],
['cloud','Cloud-only boundary','R3','Profiles & routing','Run a local shell command in cloud chat.','Host tool refusal, switch profile explicitly.'],
['standard','Standard Hybrid coding','R3','Profiles & routing','Ask a cloud planner to propose a code fix.','Review cloud proposal, local execution after approval.'],
['secure','Secure Hybrid redaction','R3','Profiles & routing','Ask cloud advice about a local project error.','Local minimization and explicit disclosure preview.'],
['offline','Provider failure / offline','R3','Safety & recovery','Cloud provider timed out.','No silent fallback; explicit route choice.'],
['elevate','OS-only authentication','R3','Safety & recovery','Install a system package.','Privilege request preview; never collect passwords in chat.'],
['revoke','Revoke session permission','R3','Safety & recovery','Continue a previously approved task.','Revoke scope; stale operation blocked.'],
['agents','Parallel agent task','R4','Agents & engines','Investigate a bug, propose a fix and review it.','Plan, local worker, independent review, cancellation.'],
['opencode','OpenCode session','R4','Agents & engines','Continue a coding session in OpenCode.','Owned vs borrowed session; progress and stop.'],
['desktop','Launch desktop application','R4','Agents & engines','Open my text editor.','Capability check and portal authorization.'],
['git','Git change review','R4','Agents & engines','Review changes and prepare a commit.','Diff preview, no automatic push or merge.'],
['market','Model discovery & reuse','R5','Models','Find an installed speech model.','Detect, validate, reuse; no automatic download.'],
['transfer','Interrupted model transfer','R5','Models','Resume a model download.','Synthetic progress; integrity and authorization HOLD.'],
['gpu','Remote GPU lease','R3','Agents & engines','Use a remote GPU for an approved job.','Lease, capacity, owner-only release.'],
['stop','Hard Stop & ownership','R1','Safety & recovery','Stop all current work.','Cancel owned work; shared Jan remains running.'],
['import','Import custom profile','R3','Profiles & routing','Import a profile from another machine.','Disabled pending review; no credentials imported.']];
const S={page:'chat',profile:'local',profiles:presets.map(p=>({...p,permissions:Object.fromEntries(tools.map(t=>[t,'DENY']))})),editing:null,tab:'Overview',conns:{},installed:new Set(models.filter(m=>m[6].startsWith('Detected')).map(m=>m[0])),messages:[],current:null,step:0,choice:'',attach:null,task:null,log:[],history:[],voice:false,speaking:false,theme:'dark',lang:'en',color:'#a8c4ff',permission:false,search:'',filter:'All',modelFilter:'All',modelSearch:'',connectionFilter:'All',transfer:0,customCounter:0};
const pages={chat:'Chat',cases:'Scenario library',tasks:'Agents & tasks',library:'Artifacts & files',market:'AI Market',models:'My models',profiles:'Profiles & permissions',connections:'Connections',engines:'Application engines',activity:'Activity & audit',settings:'Settings'};
const button=(label,act,cls='')=>'<button class="'+cls+'" data-act="'+act+'">'+esc(label)+'</button>', nav=(label,p,cls='')=>'<button class="'+cls+'" data-page="'+p+'">'+esc(label)+'</button>', tag=(s,c='')=>'<span class="tag '+c+'">'+esc(s)+'</span>', card=(title,desc,body='')=>'<div class="card"><h3>'+esc(title)+'</h3><p>'+esc(desc)+'</p>'+body+'</div>', heading=(title,desc)=>'<div class="eyebrow">JARVIS WORKSPACE</div><h1>'+esc(title)+'</h1><p class="muted">'+esc(desc)+'</p>', opts=(arr,val)=>arr.map(x=>'<option '+(x===val?'selected':'')+'>'+esc(x)+'</option>').join(''), select=(id,arr,val)=>'<select id="'+id+'">'+opts(arr,val)+'</select>', field=(label,body)=>'<label class="field">'+esc(label)+body+'</label>', input=(id,value,placeholder='')=>'<input id="'+id+'" value="'+esc(value)+'" placeholder="'+esc(placeholder)+'">', check=(id,label,on=false)=>'<label class="check"><input type="checkbox" id="'+id+'" '+(on?'checked':'')+'>'+esc(label)+'</label>', table=(head,rows)=>'<div class="matrix"><table><thead><tr>'+head.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(row=>'<tr>'+row.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>', notice=(text,w=false)=>'<div class="notice '+(w?'warn':'')+'">'+esc(text)+'</div>', progress=n=>'<div class="progress"><i style="width:'+n+'%"></i></div>';
function profile(){return S.profiles.find(p=>p.id===S.profile)||S.profiles[0]}
function audit(t){S.log.unshift({t:new Date().toLocaleTimeString(),event:t});if(S.log.length>100)S.log.pop()}
let timeout;function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(timeout);timeout=setTimeout(()=>$('toast').classList.add('hidden'),3500)}
let callback=null;function modal(title,body,actions=[]){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=button('Close','close')+actions.map(a=>button(a[0],a[1],a[2]||'')).join('');if(!$('modal').open)$('modal').showModal()}
function close(){if($('modal').open)$('modal').close()}
function top(){const p=profile();$('activeProfile').innerHTML=S.profiles.filter(x=>!x.pending).map(x=>'<option value="'+esc(x.id)+'" '+(x.id===p.id?'selected':'')+'>'+esc(x.name)+'</option>').join('');$('taskBadge').textContent=S.task?'◉ '+S.task.state:'○ Idle';$('chatModel').innerHTML=opts([p.llm,'Auto route','Qwen3-Coder 30B','Jan 4B','Cloud provider · example'],p.llm);$('mic').textContent=S.voice?'■ Stop recording':'🎙 Talk';$('speak').textContent=S.speaking?'■ Stop speaking':'◖ Speak';$('send').textContent=S.task?.state==='Running'?'■ Cancel':'↑ Send'}
function drawNav(){let h='<label>Workspace</label>'+[['chat','◈ Chat'],['cases','◇ Scenario library'],['tasks','◎ Agents & tasks'],['library','▤ Artifacts & files']].map(([p,l])=>nav(l,p,S.page===p?'selected':'')).join('')+'<label>Conversations</label>';h+=S.history.slice(0,6).map((x,i)=>'<button class="history" data-act="history:'+i+'">↳ '+esc(x.title)+'</button>').join('')||'<small style="padding:10px">No conversations yet</small>';h+='<label>Manage</label>'+[['market','◫ AI Market'],['models','▣ My models'],['profiles','◉ Profiles & permissions'],['connections','⇄ Connections'],['engines','▦ Application engines'],['activity','◷ Activity & audit'],['settings','⚙ Settings']].map(([p,l])=>nav(l,p,S.page===p?'selected':'')).join('');$('nav').innerHTML=h}
function go(p){if(!pages[p])return;S.page=p;S.tab='Overview';$('side').classList.remove('open');render();$('scroll').scrollTop=0}
function setProfile(id){const p=S.profiles.find(x=>x.id===id&&!x.pending);if(!p)return;if(S.profile!==id){S.permission=false;S.attach=null;if(S.task&&['Running','Awaiting approval'].includes(S.task.state))S.task.state='Cancelled';S.profile=id;if(S.current&&['csv','file','expiry','revoke'].includes(S.current[0]))S.choice='profile-changed';audit('Profile switched; mock session grants revoked');toast('Profile changed · session grants cleared')}render()}
function add(role,text){S.messages.push({role,text})}
function start(id){const c=cases.find(x=>x[0]===id);if(!c)return;S.current=c;S.step=0;S.choice='';S.color='#a8c4ff';S.messages=[];S.attach=null;S.task=null;S.permission=false;S.transfer=0;if(id==='cloud')S.profile='cloud';if(id==='standard')S.profile='standard';if(id==='secure')S.profile='secure';if(['csv','file','expiry','denied','stop','memory','voice','setup'].includes(id))S.profile='local';S.history.unshift({title:c[1],id});if(S.history.length>15)S.history.pop();audit('Started simulated case: '+c[1]);go('chat')}
function next(){S.step++;audit('Scenario step '+S.step+' · '+S.current?.[1]);render();$('scroll').scrollTop=$('scroll').scrollHeight}
function chart(){let vals=[20,22,24,26,28];return '<svg class="chart" viewBox="0 0 520 205" role="img" aria-label="Synthetic temperature values 20, 22, 24, 26, 28 Celsius">'+[0,1,2,3,4].map(i=>'<line class="chartline" x1="45" x2="505" y1="'+(20+i*37)+'" y2="'+(20+i*37)+'"/><text class="charttext" x="8" y="'+(24+i*37)+'">'+(30-i*3)+'</text>').join('')+vals.map((v,i)=>'<rect x="'+(65+i*90)+'" y="'+(168-(v-18)*12.3)+'" width="52" height="'+((v-18)*12.3)+'" rx="4" fill="'+S.color+'"/><text class="charttext" x="'+(90+i*90)+'" y="190" text-anchor="middle">'+(i+1)+'</text>').join('')+'</svg>'}
function approval(title,desc,allow='approve'){return card(title,desc,tag('Awaiting your approval','warn')+'<div class="divider"></div>'+button('Allow once (mock)',allow,'primary')+' '+button('Deny','deny','danger'))}
function scene(){if(!S.current)return '';const id=S.current[0],n=S.step;let h='';
if(id==='csv'){if(n===0)h=card('Attach a synthetic CSV','Use a generated example file; no actual file picker or file reads.',button('Select temperature.csv','csvAttach','primary'));else if(n===1)h=approval('Read temperature.csv','One synthetic file · read only · local analysis · no cloud.');else if(n>=2){h=card('Temperature analysis','5 synthetic measurements · local deterministic example',chart()+'<div class="grid three">'+['Mean|24 °C','Minimum|20 °C','Maximum|28 °C'].map(x=>'<div class="stat"><small>'+x.split('|')[0]+'</small><div class="metric">'+x.split('|')[1]+'</div></div>').join('')+'</div>'+table(['Sample','Temperature'],[20,22,24,26,28].map((v,i)=>[i+1,v+' °C']))+'<div class="row">'+button('Speak summary','speak')+button('Make chart blue','recolor')+button('Export…','export')+'</div>');h+=card('Follow-up context','The chart and five measurements remain associated with this conversation.',button('Ask: what was the average?','csvFollow')+' '+button('Ask: recolor to mavi','recolor'))}}
else if(id==='memory'){const turns=[['Remember the word mavi.','I will remember mavi in this demo conversation.'],['Was bedeutet das Wort?','Mavi bedeutet Blau auf Türkisch.'],['What was the word?','The word was mavi (blue).'],['Türkçe tekrar et.','Hatırladığım kelime mavi.']];h=turns.slice(0,n+1).map(([u,a])=>card(u,a)).join('')+(n<3?button('Next language turn','next','primary'):tag('Four-turn demo complete','ok'))}
else if(id==='file'){if(n===0)h=card('Select folder','Synthetic folder: Example notes · local only',button('Choose example folder','next','primary'));else if(n===1)h=approval('Authorize local folder search','Read selected folder, literal keyword antenna, no external disclosure.');else h=card('3 matching snippets','Synthetic results from two notes. No real data read.',table(['File','Snippet'],[['notes.txt','antenna testing schedule'],['radio.md','antenna position log'],['radio.md','antenna gain example']])+button('Revoke folder access','revoke'))}
else if(id==='expiry'||id==='revoke'){h=notice(n===0?'Previous permission is expired or revoked. Draft retained; no task may read the old attachment.':'Fresh mock authorization requested.',true)+(n===0?button('Choose a fresh example scope','next','primary'):n===1?approval('New scope','Only this synthetic selection; no prior grant reused.'):card('New permission approved','Mock scope renewed; no real file access.',tag('Ready','ok')))}
else if(id==='denied'||id==='desktop'||id==='git'||id==='elevate'){const d={denied:['Local shell proposal','List only the chosen sample directory. Cloud execution is prohibited.'],desktop:['Desktop launch proposal','Text editor · example Wayland portal · no actual application launch.'],git:['Review proposed change','Example repository, read-only diff. Commit, push and merge are distinct permissions.'],elevate:['System authentication boundary','The operating system would own authentication. Jarvis never asks for a password.']}[id];h=n===0?approval(d[0],d[1]):card('Simulated approval recorded','No actual command, OS launch, authentication or Git action occurred.',id==='git'?'<pre>+ validate selected request scope\n+ preserve cancellation boundary</pre>'+button('Preview commit authorization','gitCommit'):tag('Mock complete','ok'))}
else if(id==='setup'||id==='voice'){h=card(id==='setup'?'Connect a local inference model':'Speech model is not configured','Text conversation remains available when a valid LLM is configured. No auto download.',button(id==='setup'?'Open Jan setup':'Open voice settings',id==='setup'?'connect:jan':'settingsVoice','primary')+' '+button('Continue in text mode','textMode'))}
else if(id==='search'||id==='injection'){h=n===0?approval('Isolated research session','Allow read-only browsing of research.example.invalid. Separate browser profile; no personal cookies.'):card('Research results · fictional sources',id==='injection'?'Untrusted page instruction ignored. The page cannot grant tool authority.':'Example citations and provenance, not real research.',table(['Source','Finding','Trust'],[['Example report A','Local models support offline use','Fictional'],['Example report B','Hardware limits matter','Fictional']])+button('Review disclosure','disclose')+' '+button('Export report preview','export'))}
else if(id==='cloud'){h=notice('Blocked: CLOUD_CHAT has no host tools. No shell request is forwarded.',true)+card('Choose a safe alternative','Keep chat-only, or explicitly switch to a local-capable profile.',button('Switch to Local Only','switchLocal','primary')+' '+button('Explain without executing','textMode'))}
else if(id==='standard'||id==='secure'){h=n===0?card('Routing plan',id==='secure'?'Local planning → local redaction → optional cloud advice → local executor.':'Cloud proposes changes → local policy validates → local executor.',button('Review outgoing data','disclose','primary')):n===1?approval('Local execution approval','Approved advice does not authorize shell. Exact local action requires a separate scoped grant.'):card('Simulated execution result','Review completed locally. No data or command was transmitted.',tag('No actual inference','ok'))}
else if(id==='offline'){h=notice('Simulated provider timeout · automatic fallback disabled.',true)+card('Recovery options','Choose retry, a local route, or cancel.',button('Retry mock connection','retry')+' '+button('Switch to Local Only','switchLocal','primary')+' '+button('Cancel','cancel'))}
else if(['agents','opencode','gpu','stop'].includes(id)){h=card('Task orchestration','Synthetic lifecycle · no running agents or external sessions.',S.task?tag(S.task.state,S.task.state==='Completed'?'ok':'warn')+progress(S.task.progress)+table(['Actor','Ownership','State'],[['Planner','Owned',S.task.progress>=25?'Done':'Pending'],['Local worker','Owned',S.task.state],['Jan service','Borrowed','Unchanged'],['Review agent','Owned',S.task.progress>=100?'Done':'Pending']])+'<div class="row">'+button('Advance mock task','advance','primary')+button('Cancel task','cancel')+button('Hard stop','hard','danger')+'</div>':button('Start simulated task','taskStart','primary'))}
else if(id==='market'){h=card('Installed model discovery','Show discovered, catalog and compatibility evidence separately. Reuse by default.',button('Open AI Market','goMarket','primary')+' '+button('Open installed models','goModels'))}
else if(id==='transfer'){h=card('Transfer lifecycle · synthetic only','R5 transfer authorization and integrity remain HOLD. This is not a real download.',tag(S.transfer>=100?'Mock complete':'Mock paused','warn')+progress(S.transfer)+'<p>'+S.transfer+'% · simulated bytes</p>'+button('Advance mock transfer','transfer')+' '+button('Reset mock transfer','transferReset'))}

case 'searchHistory':modal('Search conversations',field('Search',input('historyQuery','','Search example history'))+'<div id="historyResults"></div>',[['Search','historySubmit','primary']]);break;case 'historySubmit':{const q=$('historyQuery').value.toLowerCase();$('historyResults').innerHTML=S.history.map((x,i)=>({x,i})).filter(o=>o.x.title.toLowerCase().includes(q)).map(o=>button(o.x.title,'openHistory:'+o.i)).join('')||'<p>No matches.</p>'}break;case 'openHistory':close();{const x=S.history[Number(v)];if(x)start(x.id)}break;case 'clearHistory':S.history=[];render();break;case 'clearLog':S.log=[];render();break;
case 'dark':case 'light':S.theme=k;document.body.classList.toggle('light',k==='light');render();break;case 'quit':modal('Quit UI preview',notice('Real desktop quit is separate from stopping shared services. This browser page remains open.'));break;case 'resetAll':modal('Reset demo',notice('Reload the page to clear all mock data, profiles, history and connections.'),[['Reset now','reload','danger']]);break;case 'reload':location.reload();break;default:console.warn('Unknown action',a)}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){close();go(b.dataset.page)}if(b.dataset.act){if(b.dataset.act.startsWith('case:'))close();action(b.dataset.act)}});document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;if(id==='activeProfile')setProfile(v);if(id==='caseFilter'){S.filter=v;render()}if(id==='connFilter'){S.connectionFilter=v;render()}if(id==='modelFilter'){S.modelFilter=v;render()}});document.addEventListener('input',e=>{const id=e.target.id;if(id==='caseSearch'||id==='modelSearch'){const pos=e.target.selectionStart;if(id==='caseSearch')S.search=e.target.value;else S.modelSearch=e.target.value;render();$(id).focus();$(id).setSelectionRange(pos,pos)}});$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}});render();
