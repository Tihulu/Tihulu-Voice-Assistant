name: Disposable GTK multiline voice draft evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/voice_draft_gtk.py'
      - 'experiments/gtk/voice_draft_widget_fixture.py'
      - 'experiments/voice_draft_display.py'
      - 'experiments/voice_composer_handoff.py'
      - 'experiments/manual_mixed_boundary.py'
      - 'experiments/mixed_voice_review.py'
      - '.github/workflows/voice-draft-gtk-evidence.yml'
permissions:
  contents: read
jobs:
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify frozen shipping paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Install disposable native GTK dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-gtk-4.0 xvfb xauth dbus-x11
      - name: Real Gtk TextView and button fixture
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          G_DEBUG: fatal-criticals
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 experiments/gtk/voice_draft_widget_fixture.py
