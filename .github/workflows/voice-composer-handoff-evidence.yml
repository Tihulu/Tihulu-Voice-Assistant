name: Disposable reviewed neural voice composer draft evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/speech_engine_acceptance.py'
      - 'experiments/mixed_voice_review.py'
      - 'experiments/language_detection.py'
      - 'experiments/piper_engine_acceptance.py'
      - 'experiments/piper-fixture-requirements.txt'
      - 'experiments/voice_quality.py'
      - 'experiments/speech_result.py'
      - 'experiments/transcription_result.py'
      - 'experiments/gateway.py'
      - 'experiments/manual_mixed_boundary.py'
      - 'experiments/voice_composer_handoff.py'
      - '.github/workflows/voice-composer-handoff-evidence.yml'
permissions:
  contents: read
jobs:
  multilingual:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: small
            sha: 1be3a9b2063867b937e64e2ec7483364a79917e157fa98c5d94b5c1fffea987b
            max_bytes: 500000000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and unchanged shipped paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Prepare disposable pinned public dependencies
        env:
          STT_PROFILE: ${{ matrix.profile }}
          STT_SHA: ${{ matrix.sha }}
          STT_MAX: ${{ matrix.max_bytes }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap cmake build-essential curl espeak-ng ffmpeg python3-venv libgomp1
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/multilingual-stt"
          git init "$RUNNER_TEMP/multilingual-stt/source"
          git -C "$RUNNER_TEMP/multilingual-stt/source" -c credential.helper= fetch --depth 1 https://github.com/ggml-org/whisper.cpp.git 4979e04f5dcaccb36057e059bbaed8a2f5288315
          git -C "$RUNNER_TEMP/multilingual-stt/source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/multilingual-stt/source" rev-parse HEAD)" = 4979e04f5dcaccb36057e059bbaed8a2f5288315
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 180 --max-filesize "$STT_MAX" -o "$RUNNER_TEMP/multilingual-stt/model.bin" "https://huggingface.co/ggerganov/whisper.cpp/resolve/fb5ed9369c26eaf08392504d8446da431e0fffb9/ggml-$STT_PROFILE.bin"
          echo "$STT_SHA  $RUNNER_TEMP/multilingual-stt/model.bin" | sha256sum -c -
          cmake -S "$RUNNER_TEMP/multilingual-stt/source" -B "$RUNNER_TEMP/multilingual-stt/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build "$RUNNER_TEMP/multilingual-stt/build" --target whisper-cli -j 2
      - name: Prepare three locked neural voices
        run: |
          mkdir -p "$RUNNER_TEMP/mixed-piper/site" "$RUNNER_TEMP/mixed-piper/wheels"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/mixed-piper/venv"
          "$RUNNER_TEMP/mixed-piper/venv/bin/python" -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --dest "$RUNNER_TEMP/mixed-piper/wheels" -r experiments/piper-fixture-requirements.txt
          "$RUNNER_TEMP/mixed-piper/venv/bin/python" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/mixed-piper/wheels" --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/mixed-piper/site" -r experiments/piper-fixture-requirements.txt
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 70000000 -o "$RUNNER_TEMP/mixed-piper/tr.onnx" 'https://huggingface.co/rhasspy/piper-voices/resolve/7a90ba8ce175d52cf5b0f6e7fb78ca958bbfcd67/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx'
          echo "2844717f524ab965d3fe86e60562cbb601d3e456836efcc2196cc3a14112a8fb  $RUNNER_TEMP/mixed-piper/tr.onnx" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 16384 -o "$RUNNER_TEMP/mixed-piper/tr.json" 'https://huggingface.co/rhasspy/piper-voices/resolve/7a90ba8ce175d52cf5b0f6e7fb78ca958bbfcd67/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx.json'
          echo "13ebd7810f1b61b5027583cf3131a0a233b6ea81c38f2200ebc4ff41c3cca039  $RUNNER_TEMP/mixed-piper/tr.json" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 70000000 -o "$RUNNER_TEMP/mixed-piper/en.onnx" 'https://huggingface.co/rhasspy/piper-voices/resolve/a08e8fa47faf6681ecc42a79cfa95369430cbcf6/en/en_US/lessac/medium/en_US-lessac-medium.onnx'
          echo "5efe09e69902187827af646e1a6e9d269dee769f9877d17b16b1b46eeaaf019f  $RUNNER_TEMP/mixed-piper/en.onnx" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 16384 -o "$RUNNER_TEMP/mixed-piper/en.json" 'https://huggingface.co/rhasspy/piper-voices/resolve/a08e8fa47faf6681ecc42a79cfa95369430cbcf6/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json'
          echo "efe19c417bed055f2d69908248c6ba650fa135bc868b0e6abb3da181dab690a0  $RUNNER_TEMP/mixed-piper/en.json" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 70000000 -o "$RUNNER_TEMP/mixed-piper/de.onnx" 'https://huggingface.co/rhasspy/piper-voices/resolve/5227e415beb85e92d953cfba376bfc72104bc7ff/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx'
          echo "7e64762d8e5118bb578f2eea6207e1a35a8e0c30595010b666f983fc87bb7819  $RUNNER_TEMP/mixed-piper/de.onnx" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 16384 -o "$RUNNER_TEMP/mixed-piper/de.json" 'https://huggingface.co/rhasspy/piper-voices/resolve/5227e415beb85e92d953cfba376bfc72104bc7ff/de/de_DE/thorsten/medium/de_DE-thorsten-medium.onnx.json'
          echo "34342a789afa94f724419fac8ce5f1387f12f5968644ef5894866145e463e004  $RUNNER_TEMP/mixed-piper/de.json" | sha256sum -c -
      - name: Actual edited voice to inert composer draft
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
          STT_PROFILE: ${{ matrix.profile }}
        run: |
          /usr/bin/python3 experiments/speech_engine_acceptance.py "$RUNNER_TEMP/multilingual-stt/build/bin/whisper-cli" "$RUNNER_TEMP/multilingual-stt/model.bin" "$STT_PROFILE" mixed-manual-piper-handoff "$RUNNER_TEMP/mixed-piper"
