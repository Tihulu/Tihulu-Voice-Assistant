name: Disposable application engine evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/application_engine_acceptance.py'
      - 'experiments/conversion_result.py'
      - 'experiments/capabilities.py'
      - '.github/workflows/application-engine-evidence.yml'
permissions:
  contents: read
jobs:
  engine-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and unchanged shipped paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Prepare disposable application engines
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y ffmpeg libreoffice-writer poppler-utils fonts-dejavu-core
          dpkg-query -W ffmpeg libreoffice-writer poppler-utils fonts-dejavu-core
      - name: Run fixed public synthetic engine cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: src:experiments
        run: /usr/bin/python3 experiments/application_engine_acceptance.py
