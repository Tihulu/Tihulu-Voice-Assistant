name: Rust store dependency resolution evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/rust-core/store-native/Cargo.toml'
      - '.github/workflows/rust-store-lock-fixture.yml'
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Resolve candidate lock without compiling dependencies
        working-directory: experiments/rust-core/store-native
        run: |
          rustup toolchain install 1.90.0 --profile minimal
          cargo +1.90.0 generate-lockfile
          echo JARVIS_LOCK_BEGIN
          cat Cargo.lock
          echo JARVIS_LOCK_END
