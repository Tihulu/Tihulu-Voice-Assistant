name: Disposable pinned Piper Turkish neural speech evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/piper_engine_acceptance.py'
      - 'experiments/piper-fixture-requirements.txt'
      - 'experiments/speech_result.py'
      - 'experiments/capabilities.py'
      - 'experiments/gateway.py'
      - '.github/workflows/piper-engine-evidence.yml'
permissions:
  contents: read
jobs:
  piper:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and unchanged shipped paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Prepare public pinned wheels and voice
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap python3-venv curl libgomp1
          test "$(id -u)" -ne 0
          mkdir -p "$RUNNER_TEMP/piper-fixture/wheels" "$RUNNER_TEMP/piper-fixture/site"
          /usr/bin/python3 -m venv "$RUNNER_TEMP/piper-fixture/venv"
          "$RUNNER_TEMP/piper-fixture/venv/bin/python" -m pip --isolated download --index-url https://pypi.org/simple --only-binary=:all: --require-hashes --dest "$RUNNER_TEMP/piper-fixture/wheels" -r experiments/piper-fixture-requirements.txt
          "$RUNNER_TEMP/piper-fixture/venv/bin/python" -m pip --isolated install --no-index --find-links "$RUNNER_TEMP/piper-fixture/wheels" --only-binary=:all: --require-hashes --target "$RUNNER_TEMP/piper-fixture/site" -r experiments/piper-fixture-requirements.txt
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 70000000 -o "$RUNNER_TEMP/piper-fixture/voice.onnx" 'https://huggingface.co/rhasspy/piper-voices/resolve/7a90ba8ce175d52cf5b0f6e7fb78ca958bbfcd67/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx'
          echo "2844717f524ab965d3fe86e60562cbb601d3e456836efcc2196cc3a14112a8fb  $RUNNER_TEMP/piper-fixture/voice.onnx" | sha256sum -c -
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 16384 -o "$RUNNER_TEMP/piper-fixture/voice.json" 'https://huggingface.co/rhasspy/piper-voices/resolve/7a90ba8ce175d52cf5b0f6e7fb78ca958bbfcd67/tr/tr_TR/dfki/medium/tr_TR-dfki-medium.onnx.json'
          echo "13ebd7810f1b61b5027583cf3131a0a233b6ea81c38f2200ebc4ff41c3cca039  $RUNNER_TEMP/piper-fixture/voice.json" | sha256sum -c -
      - name: Actual neural TTS in private CPU fixture
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          /usr/bin/python3 experiments/piper_engine_acceptance.py "$RUNNER_TEMP/piper-fixture/site" "$RUNNER_TEMP/piper-fixture/voice.onnx" "$RUNNER_TEMP/piper-fixture/voice.json"
