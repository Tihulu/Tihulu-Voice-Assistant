name: Core and native GTK tests
on:
  pull_request:
    branches: [main, 'feat/m1-portable-core', 'feat/modes-and-profiles', 'feat/profile-ui',
               'feat/market-ui']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Check source and run deterministic fixtures
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Build sdist and wheel, then verify the installed package
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m venv .buildvenv
          .buildvenv/bin/pip install -q build
          .buildvenv/bin/python -m build --sdist --wheel --outdir dist
          ls -l dist
          python - <<'CHECK'
          import pathlib, sys, zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1, (wheels, sdists)
          names = set(zipfile.ZipFile(wheels[0]).namelist())
          tag = "tihulu_jarvis-0.1.0.dev0"
          required = {
              "tihulu_jarvis/__init__.py", "tihulu_jarvis/desktop.py", "tihulu_jarvis/settings.py",
              "tihulu_jarvis/profiles.py", "tihulu_jarvis/market.py", "tihulu_jarvis/contracts.py",
              "tihulu_jarvis/voice/__init__.py", "tihulu_jarvis/voice/m1.py",
              "tihulu_jarvis/voice/jan.py", "tihulu_jarvis/voice/audio.py",
              "tihulu_jarvis/voice/session.py",
              tag + ".dist-info/licenses/LICENSE",
              tag + ".dist-info/entry_points.txt",
              # Desktop metadata travels as wheel data, installed under the prefix.
              tag + ".data/data/share/applications/io.github.Tihulu.Jarvis.desktop",
              tag + ".data/data/share/icons/hicolor/scalable/apps/io.github.Tihulu.Jarvis.svg",
          }
          missing = required - names
          assert not missing, missing
          leaks = [n for n in names
                   if n.startswith(("tests/", "docs/", "data/")) and "/share/" not in n]
          assert not leaks, leaks
          for banned in ("password", "nvapi-", "/home/", "jarvis.json"):
              assert not any(banned in n for n in names), banned
          print("wheel content verified:", len(names), "entries")
          CHECK
          python -m venv .runvenv
          .runvenv/bin/pip install -q dist/*.whl
          # The suite must pass against the installed artefact, not the source tree.
          (cd /tmp && "$GITHUB_WORKSPACE/.runvenv/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -t "$GITHUB_WORKSPACE/tests" 2>&1 | tail -n 5)
          .runvenv/bin/python -c "import tihulu_jarvis, tihulu_jarvis.market as m; print('installed import ok', m.CATEGORIES)"
          .runvenv/bin/python -c "import tihulu_jarvis.desktop as d; print('entry module ok', hasattr(d, 'main'))"
          test -x .runvenv/bin/tihulu-jarvis && echo "console script installed"
  gtk:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install native display test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y python3-gi gir1.2-gtk-4.0 xvfb xauth dbus-x11
      - name: Exercise real GTK widgets with synthetic backends
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
          GDK_BACKEND: x11
          GSK_RENDERER: cairo
          GTK_A11Y: none
          G_DEBUG: fatal-criticals
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover -s tests/gtk -v
