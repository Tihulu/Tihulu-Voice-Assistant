name: Disposable engine isolation feasibility (Ubuntu 22.04)
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/engine_isolation_acceptance.py'
      - '.github/workflows/engine-isolation-evidence.yml'
permissions:
  contents: read
jobs:
  isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and unchanged shipped paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Prepare disposable tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap ffmpeg
          bwrap --version
          uname -r
          test "$(id -u)" -ne 0
      - name: Verify unprivileged fixture isolation without weakening runner security
        run: /usr/bin/python3 experiments/engine_isolation_acceptance.py
