name: Disposable isolated pinned four-worker model evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/local_agent_model_chain_acceptance.py'
      - 'experiments/local_agent_retry_budget_session.py'
      - 'experiments/local_agent_vector_resources.py'
      - 'experiments/local_agent_vector_planner.py'
      - 'experiments/local_agent_vector_admission.py'
      - 'experiments/local_agent_retry_deadline.py'
      - 'experiments/local_agent_native_deadline_evidence.py'
      - 'experiments/local_agent_native_retry_evidence.py'
      - 'experiments/heterogeneous_model_native_evidence.py'
      - 'experiments/heterogeneous_model_review.py'
      - 'experiments/heterogeneous_model_owned_review.py'
      - 'experiments/heterogeneous_team_review_token_adapter.py'
      - 'experiments/heterogeneous_team_token_budget.py'
      - 'experiments/local_agent_model_fixture_contract.py'
      - 'experiments/local_agent_model_token_ledger.py'
      - 'experiments/local_agent_model_budget_admission.py'
      - 'experiments/local_agent_model_stream_contract.py'
      - 'experiments/local_agent_wave_run.py'
      - 'experiments/local_agent_owned_drain.py'
      - 'experiments/local_agent_launch.py'
      - 'experiments/local_agent_replan.py'
      - '.github/workflows/local-agent-model-chain-evidence.yml'
permissions:
  contents: read
jobs:
  cpu-llm:
    runs-on: ubuntu-22.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and unchanged shipped paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Prepare fixed public dependencies on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y bubblewrap cmake build-essential curl
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/llama-fixture"
          git init "$RUNNER_TEMP/llama-fixture/source"
          git -C "$RUNNER_TEMP/llama-fixture/source" -c credential.helper= fetch --depth 1 https://github.com/ggml-org/llama.cpp.git 4762ad7316dcdec20016ab5985fb46a27902204d
          git -C "$RUNNER_TEMP/llama-fixture/source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llama-fixture/source" rev-parse HEAD)" = 4762ad7316dcdec20016ab5985fb46a27902204d
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 60 --max-filesize 2097152 -o "$RUNNER_TEMP/llama-fixture/model.gguf" 'https://huggingface.co/ggml-org/models-moved/resolve/688f41ddf8f3622d08c6954a061ff12999b6c8d8/tinyllamas/stories260K.gguf'
          echo "047bf46455a544931cff6fef14d7910154c56afbc23ab1c5e56a72e69912c04b  $RUNNER_TEMP/llama-fixture/model.gguf" | sha256sum -c -
      - name: Build pinned CPU engine
        run: |
          cmake -S "$RUNNER_TEMP/llama-fixture/source" -B "$RUNNER_TEMP/llama-fixture/build" -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/llama-fixture/build" --target llama-server -j 2
      - name: Actual isolated fixed four-worker inference
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf"
      - name: Actual model post-inference revocation before publication
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" revoke
      - name: Actual fixed model stream cancellation after first event
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" stream-cancel
      - name: Actual fixed model whole-wave budget refusal
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" budget-hold
      - name: Actual fixed model economy role ceilings
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" economy
      - name: Actual isolated pre-launch whole-plan refusal (no inference)
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" plan-hold
      - name: Actual fixed public mixed data to local model
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" mixed-data
      - name: Actual fixed mixed data source revocation before model publication
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" mixed-revoke
      - name: Actual shared team budget with prior and review native inference
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" mixed-shared
      - name: Actual shared team budget with revoked review output
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" mixed-shared-revoke
      - name: Shared budget exhaustion before any model spawn (synthetic prior charge)
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" mixed-shared-hold
      - name: Actual parallel four-worker shared team budget
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" shared-chain
      - name: Actual parallel shared budget with revoked results
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" shared-chain-revoke
      - name: Shared whole-wave refusal before peer process launch
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" shared-chain-hold
      - name: Actual cumulative fixed-model retry with explicit economy confirmation
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-cumulative
      - name: Actual retry with separate cumulative prompt and generated budgets
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-dual
      - name: Actual prompt-only retry refusal before new process launch
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-prompt-hold
      - name: Actual explicit wave prompt admission at exact peer boundary
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-wave-prompt
      - name: Actual later wave prompt refusal before peer launch
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-wave-prompt-hold
      - name: Actual native late result with monotonic worker deadline
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-deadline
      - name: Actual streaming cancellation at monotonic worker deadline
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-stream-deadline
      - name: Actual CPU retry with vector wave reservation
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-vector-cpu
      - name: Actual CPU retry with competing resource hold before peer launch
        run: /usr/bin/python3 experiments/local_agent_model_chain_acceptance.py "$RUNNER_TEMP/llama-fixture/build/bin/llama-server" "$RUNNER_TEMP/llama-fixture/model.gguf" retry-vector-hold
