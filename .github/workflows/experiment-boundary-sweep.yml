name: Experimental boundary sweep (maintainer evidence)
on:
  pull_request:
    branches: ['experiment/cross-motor-workflow']
permissions:
  contents: read
jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git diff --exit-code ff871098547fec01005edd0ee9b522ef9b66d64a HEAD -- src experiments packaging tools tests pyproject.toml
      - env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 qa/experiment_boundary_sweep.py
