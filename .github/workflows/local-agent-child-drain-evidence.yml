name: Disposable fixed local agent child drain evidence
on:
  pull_request:
    branches: ['**']
    paths:
      - 'experiments/local_agent_owned_drain.py'
      - 'experiments/local_agent_wave_run.py'
      - 'experiments/local_agent_resources.py'
      - 'experiments/fixtures/agent_child_drain_fixture.py'
      - '.github/workflows/local-agent-child-drain-evidence.yml'
permissions:
  contents: read
jobs:
  child-drain:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact head and frozen shipping paths
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
      - name: Run fixed public child lifecycle test only
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: /usr/bin/python3 experiments/fixtures/agent_child_drain_fixture.py
