name: Owner handoff rehearsal (maintainer evidence)
on:
  pull_request:
    branches: ['fix/chat-first-result-lifetime']
permissions:
  contents: read
jobs:
  owner-handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Provision disposable build dependencies on runner only
        run: |
          python -m venv "$RUNNER_TEMP/owner-builder"
          "$RUNNER_TEMP/owner-builder/bin/pip" install build 'setuptools>=77' wheel
      - name: Verify exact target and rehearse non-installing preparation
        run: |
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml
          sh -n qa/prepare-owner-preview.sh
          if sh qa/prepare-owner-preview.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/missing-builder"; then
            echo 'Missing builder unexpectedly accepted'; exit 1
          fi
          sh qa/prepare-owner-preview.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/owner-builder"
          git diff --exit-code
          python - <<'CHECK'
          import json
          from pathlib import Path
          reports = list(Path("/tmp").glob("jarvis-owner-build-*/jarvis-owner-preview-*/acceptance.json"))
          assert len(reports) == 1
          assert reports[0].parent.parent.stat().st_mode & 0o777 == 0o700
          assert reports[0].parent.stat().st_mode & 0o777 == 0o700
          report = json.loads(reports[0].read_text())
          assert report["commit"] == "d4b756351b1552aa5806c89e39eda3b5b82aa337"
          assert report["source_content"] == "PASS"
          assert report["physical_acceptance"] == "UNKNOWN"
          assert report["independent_review"] == "NOT_CLAIMED"
          assert report["clean_install"] == "NOT_RUN"
          assert len(report["scenarios"]) == 12
          assert set(report["scenarios"].values()) == {"UNKNOWN"}
          print("Owner handoff fixture verified; physical acceptance remains UNKNOWN")
          CHECK
