name: Isolated R2-R5 experimental fixtures
on:
  pull_request:
    branches: ['fix/chat-first-result-lifetime', 'experiment/r3-shared-boundary', 'experiment/r3-typed-application-capabilities', 'experiment/r3-document-result-provenance', 'experiment/real-document-engine-fixtures', 'experiment/browser-exact-navigation-contract', 'experiment/search-query-result-provenance', 'experiment/application-engine-readiness', 'experiment/document-real-output-contract-evidence', 'experiment/fix-poppler-namespace-geometry', 'experiment/pdf-page-ocr-provenance', 'experiment/mixed-pdf-real-page-fallback', 'experiment/owned-browser-task-lifecycle', 'experiment/local-document-summary-chain', 'experiment/real-installed-application-engine-fixtures', 'experiment/typed-engine-output-contract', 'experiment/real-engine-conversion-receipts', 'experiment/bounded-engine-isolation-evidence', 'experiment/pdf-split-merge-real-evidence', 'experiment/conversion-publication-separate-grant', 'experiment/publication-write-ceiling', 'experiment/engine-isolation-alternate-runner', 'experiment/atomic-dependent-publication', 'experiment/engine-isolation-loader-roundtrip', 'experiment/real-engine-preflight-binding', 'experiment/isolated-engine-bound-receipt', 'experiment/atomic-publication-no-clobber', 'experiment/atomic-browser-document-chain', 'experiment/publication-bound-directory', 'experiment/bounded-isolated-engine-process', 'experiment/isolated-readonly-root-scope', 'experiment/document-local-adapter-chain', 'experiment/isolated-file-limit-exact-probe', 'experiment/persist-fixture-dependency-edges', 'experiment/isolation-fail-closed-preflight', 'experiment/isolated-real-document-engines', 'experiment/local-stream-exact-invocation', 'experiment/publication-phase-failure-evidence', 'experiment/isolated-libreoffice-conversion', 'experiment/isolated-pdf-manipulation', 'experiment/typed-pdf-manipulation-receipts', 'experiment/isolated-office-package-config', 'experiment/isolated-pdf-phase-gates', 'experiment/office-private-identity-bootstrap', 'experiment/office-exact-registry-bootstrap', 'experiment/local-sse-response-contract', 'experiment/local-http-socketpair-evidence', 'experiment/isolated-firefox-webdriver', 'experiment/local-http-exact-eof', 'experiment/firefox-isolated-loader-diagnostics', 'experiment/office-specific-sandbox-recheck', 'experiment/firefox-wrapper-dependency', 'experiment/firefox-exact-package-binary', 'experiment/firefox-host-loopback-denial', 'experiment/firefox-bounded-session-startup', 'experiment/local-http-live-checkpoint', 'experiment/offline-browser-exact-capabilities', 'experiment/firefox-structured-navigation-denial']
permissions:
  contents: read
jobs:
  experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact head and refuse shipped-source changes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
          git diff --name-only d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD
      - name: Run synthetic experiment tests only
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
