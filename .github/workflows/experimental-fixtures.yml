name: Isolated R2-R5 experimental fixtures
on:
  pull_request:
    branches: ['fix/chat-first-result-lifetime', 'experiment/r3-shared-boundary', 'experiment/r3-typed-application-capabilities', 'experiment/r3-document-result-provenance', 'experiment/real-document-engine-fixtures', 'experiment/browser-exact-navigation-contract', 'experiment/search-query-result-provenance', 'experiment/application-engine-readiness', 'experiment/document-real-output-contract-evidence', 'experiment/fix-poppler-namespace-geometry', 'experiment/pdf-page-ocr-provenance', 'experiment/mixed-pdf-real-page-fallback', 'experiment/owned-browser-task-lifecycle', 'experiment/local-document-summary-chain', 'experiment/real-installed-application-engine-fixtures', 'experiment/typed-engine-output-contract', 'experiment/real-engine-conversion-receipts', 'experiment/bounded-engine-isolation-evidence', 'experiment/pdf-split-merge-real-evidence', 'experiment/conversion-publication-separate-grant', 'experiment/publication-write-ceiling', 'experiment/engine-isolation-alternate-runner', 'experiment/atomic-dependent-publication', 'experiment/engine-isolation-loader-roundtrip', 'experiment/real-engine-preflight-binding', 'experiment/isolated-engine-bound-receipt', 'experiment/atomic-publication-no-clobber']
permissions:
  contents: read
jobs:
  experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Refuse shipped-source changes
        run: |
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
          git diff --name-only d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD
      - name: Run synthetic experiment tests only
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
