permissions:
  contents: read
jobs:
  experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify exact head and refuse shipped-source changes
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD -- src packaging tools tests pyproject.toml data
          git diff --name-only d4b756351b1552aa5806c89e39eda3b5b82aa337 HEAD
      - name: Parse all experimental Python sources without writing bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          failures=[]
          paths=sorted(Path("experiments").rglob("*.py"))
          for path in paths:
              try:
                  ast.parse(path.read_bytes(),filename=str(path))
              except (SyntaxError,ValueError) as exc:
                  failures.append(str(exc))
          print("Parsed",len(paths),"experimental Python sources")
          if failures:
              raise SystemExit("\n".join(failures))
          PY
      - name: Run synthetic experiment tests only
        env:
          PYTHONPATH: src:experiments
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s experiments -p 'test_*.py' -v
